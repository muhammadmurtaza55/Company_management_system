{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="mb-4">
        <i class="bi bi-compass text-warning" style="font-size: 5rem;"></i>
      </div>
      <h1 class="display-4 fw-bold">404</h1>
      <h3 class="fw-semibold mb-3">Page Not Found</h3>
      <p class="text-muted mb-4">
        The requested resource could not be found on this server. Please check the URL or return to the dashboard.
      </p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
